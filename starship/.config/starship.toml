[character]
success_symbol = "[\\$](purple)"
error_symbol = "[\\$](red)"

[git_branch]
# without 'on' prefix
format = '[$symbol$branch(:$remote_branch)]($style) '

[hostname]
ssh_symbol = '☢  '
style = 'bold dimmed cyan'

[battery]
disabled = true

[env_var.CSHIM_ENV]
variable = 'CSHIM_ENV'
format = '[\($env_value\)]($style) '
style = 'bold blue'
