[general]
import = ["themes/zenwritten_dark.toml"]

[terminal]
shell = "zsh"

[cursor.style]
blinking = "Off"
shape = "Block"

[window]
opacity = 0.9

[env]
WINIT_X11_SCALE_FACTOR = "1"
TERM = "xterm-256color"

[font]
size = 12

[font.normal]
family = "JetBrainsMono Nerd Font"

[scrolling]
history = 100000
multiplier = 3

[bell.command]
program = "sh"
args = ["-c", "mpv ~/.config/alacritty/bell.mp3"]
