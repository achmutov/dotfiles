# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible' # TODO: check if necessary

if "test -f /usr/bin/zsh" { set -g default-shell "/usr/bin/zsh" }

unbind C-b
set -g prefix M-a
set -g prefix2 M-j

# relay over ssh
bind M-a send-prefix
bind M-j send-prefix

bind s choose-tree -sZ -O name
bind T if-shell '[ #{pane_input_off} -eq 0 ]' { selectp -d } { selectp -e }

setw -g mode-keys vi
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-selection-and-cancel

bind -n C-M-h selectp -L
bind -n C-M-j selectp -D
bind -n C-M-k selectp -U
bind -n C-M-l selectp -R

set  -g base-index 1
set  -g pane-base-index 1
setw -g pane-base-index 1
set  -g renumber-windows on

setw -g mouse on
set  -g repeat-time 0

# set  -sa terminal-overrides ",xterm*:Tc" # TODO: don't quite understand how it works
# set -g default-terminal "screen-256color"

set -g status-bg black
set -g status-fg white
set -g status-right "#{?pane_input_off,[RO] |,} %a %F | %H:%M | #H "
set -g window-status-current-format "#[fg=blue]#I: #W"

# Split cwd
bind '"' split -v -c "#{pane_current_path}"
bind  %  split -h -c "#{pane_current_path}"

# TODO: junk regex, but it works most of the time
bind j copy-mode \; send -X search-backward "[^: ]+(:[0-9]+){1,2}"

bind R source "$XDG_CONFIG_HOME/tmux/tmux.conf" \; display "tmux.conf reloaded from $XDG_CONFIG_HOME"
bind r source "$HOME/.config/tmux/tmux.conf" \; display "tmux.conf reloaded from $HOME/.config"

run '$XDG_CONFIG_HOME/tmux/plugins/tpm/tpm || $HOME/.config/tmux/plugins/tpm/tpm'
